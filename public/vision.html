<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LapasID — Vision</title>

<!-- Privatus vartų puslapis: jokio turinio, neindeksuojam. -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">

<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="icon" href="/favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#1c3a2a">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --forest-900: #0d2118;
    --forest-800: #1c3a2a;
    --forest-600: #3f6b54;
    --forest-500: #5e8270;
    --forest-400: #8da89a;
    --bone:       #f1ebdd;
    --bone-50:    #faf6ec;
    --rule:       rgba(28,58,42,0.12);
    --error:      #b3402e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bone);
    color: var(--forest-800);
    font-family: 'Bricolage Grotesque', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
    padding: 0 24px;
    /* „Durys, ne siena" — šiltas blush, ne tuščia siena. */
    background-image:
      radial-gradient(120% 80% at 50% -8%, rgba(63,107,84,0.10), transparent 60%),
      radial-gradient(90% 60% at 100% 112%, rgba(184,106,58,0.07), transparent 55%);
  }

  /* Letterhead: viršuje mark + slaptažodis (raktas); centre kalbos žodžiai (durys/herojus). */
  .gate { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; text-align: center; }
  .head { display: flex; flex-direction: column; align-items: center; padding-top: clamp(36px, 7vh, 72px); }
  /* Didelis apatinis padding'as „pakelia" centruotus žodžius aukštyn link tikro viewport centro. */
  .choices-zone { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: clamp(120px, 22vh, 220px); }

  .mark { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .mark svg { width: 34px; height: 34px; }
  .mark .wordmark { font-weight: 600; font-size: 21px; letter-spacing: -0.035em; color: var(--forest-800); }
  .mark .wordmark .id { opacity: 0.55; font-weight: 400; }

  /* ---------- SLAPTAŽODIS — minimalus underline, kad nekonkuruotų su kalbos žodžiais ---------- */
  .pw-wrap { width: 100%; max-width: 360px; margin-bottom: 2px; }
  .pw {
    width: 100%; text-align: center;
    font-family: 'JetBrains Mono', monospace; font-size: 14px; letter-spacing: 0.14em;
    color: var(--forest-800); background: transparent;
    border: 0; border-bottom: 1.5px solid var(--rule); border-radius: 0;
    padding: 13px 8px; outline: none;
    transition: border-color 0.2s ease;
  }
  .pw::placeholder { color: var(--forest-400); letter-spacing: 0.18em; text-transform: uppercase; font-size: 10.5px; }
  .pw:focus { border-bottom-color: var(--forest-600); }
  .pw-wrap.is-error .pw { border-bottom-color: var(--error); animation: shake 0.4s; }

  .err {
    height: 14px; margin: 14px 0 24px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--error); opacity: 0; transition: opacity 0.2s ease;
  }
  .err.show { opacity: 1; }

  /* ---------- KALBA = SUBMIT ---------- */
  .choices { width: 100%; border-top: 1px solid var(--rule); }
  .choice {
    width: 100%; position: relative; display: flex; align-items: center; justify-content: center;
    border: 0; border-bottom: 1px solid var(--rule); background: transparent; cursor: pointer;
    padding: 24px; font-family: inherit; -webkit-tap-highlight-color: transparent;
    transition: background 0.25s ease;
  }
  .choice .word {
    font-size: clamp(34px, 8vw, 64px); font-weight: 500; letter-spacing: -0.04em; line-height: 1;
    color: var(--forest-800); transition: color 0.25s ease;
  }
  .choice .tail {
    position: absolute; right: 24px; top: 50%; transform: translateY(-50%) translateX(-6px);
    font-size: 24px; color: var(--forest-400); opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .choice:hover, .choice:focus-visible { background: var(--bone-50); outline: none; }
  .choice:hover .word, .choice:focus-visible .word { color: var(--forest-900); }
  .choice:hover .tail, .choice:focus-visible .tail { opacity: 1; transform: translateY(-50%) translateX(0); }
  /* Teisingas slaptažodis → pasirinktas mygtukas pažaliuoja (forest fill). */
  .choice.is-correct { background: var(--forest-800); }
  .choice.is-correct .word { color: var(--bone); }
  .choice.is-correct .tail { opacity: 1; transform: translateY(-50%) translateX(0); color: var(--bone); }
  .choices.is-busy .choice { cursor: wait; }
  .choices.is-busy .choice:not(.is-correct) { opacity: 0.45; }

  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }

  /* .err NEįtraukiamas — jis turi likti paslėptas (opacity:0), kol neįvyksta klaida;
     rise animacija baigiasi ties opacity:1, todėl ją perrašytų ir parodytų iš karto. */
  @media (prefers-reduced-motion: no-preference) {
    .mark, .pw-wrap, .choice { opacity: 0; animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .mark { animation-delay: 0.05s; }
    .pw-wrap { animation-delay: 0.15s; }
    .choices .choice:nth-child(1) { animation-delay: 0.25s; }
    .choices .choice:nth-child(2) { animation-delay: 0.33s; }
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

  @media (max-width: 600px) {
    .mark { margin-bottom: 30px; }
    .choice { padding: 20px 16px; }
    .choice .tail { right: 14px; font-size: 20px; }
  }
</style>
</head>
<body>
  <main class="gate" role="main">
    <div class="head">
    <div class="mark">
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="16" y="54" width="4" height="50" rx="1" fill="#1c3a2a"/>
        <rect x="24" y="54" width="2" height="50" rx="1" fill="#1c3a2a"/>
        <rect x="30" y="54" width="6" height="50" rx="1" fill="#1c3a2a"/>
        <rect x="40" y="54" width="3" height="50" rx="1" fill="#1c3a2a"/>
        <rect x="47" y="54" width="5" height="50" rx="1" fill="#1c3a2a"/>
        <rect x="56" y="54" width="2" height="50" rx="1" fill="#1c3a2a"/>
        <rect x="62" y="34" width="4" height="70" rx="1" fill="#1c3a2a"/>
        <rect x="72" y="54" width="3" height="50" rx="1" fill="#1c3a2a"/>
        <rect x="79" y="54" width="6" height="50" rx="1" fill="#1c3a2a"/>
        <rect x="89" y="54" width="2" height="50" rx="1" fill="#1c3a2a"/>
        <rect x="95" y="54" width="4" height="50" rx="1" fill="#1c3a2a"/>
        <path d="M64 30 C 62 12 80 2 106 0 C 102 20 88 32 68 34 C 66 34 64 32 64 30 Z" fill="#1c3a2a"/>
        <path d="M62 34 C 56 32 46 32 40 36 C 44 42 54 42 60 38 Z" fill="#1c3a2a"/>
      </svg>
      <span class="wordmark">Lapas<span class="id">ID</span></span>
    </div>

    <div class="pw-wrap" id="pwWrap">
      <input id="pw" class="pw" type="password" inputmode="text" autocomplete="current-password"
             autocapitalize="off" spellcheck="false" placeholder="Slaptažodis · Password"
             aria-label="Slaptažodis · Password" />
    </div>
    <div class="err" id="err" role="alert">Neteisingas slaptažodis · Wrong password</div>
    </div><!-- /.head -->

    <div class="choices-zone">
      <div class="choices" id="choices">
        <button type="button" class="choice" data-lang="lt" lang="lt">
          <span class="word">Lietuvių</span><span class="tail" aria-hidden="true">→</span>
        </button>
        <button type="button" class="choice" data-lang="en" lang="en">
          <span class="word">English</span><span class="tail" aria-hidden="true">→</span>
        </button>
      </div>
    </div>
  </main>

<script>
  (function() {
    var pw      = document.getElementById('pw');
    var pwWrap  = document.getElementById('pwWrap');
    var err     = document.getElementById('err');
    var choices = document.getElementById('choices');
    var busy    = false;

    function nudge() {
      pwWrap.classList.add('is-error');
      setTimeout(function() { pwWrap.classList.remove('is-error'); }, 450);
    }
    function showError() {
      nudge();
      err.classList.add('show');
      pw.value = '';
      pw.focus();
    }
    function clearError() { err.classList.remove('show'); }

    async function submit(lang, btn) {
      if (busy) return;
      var password = pw.value;
      if (!password) { pw.focus(); nudge(); return; }   // tuščias → tik nudge, jokio POST
      busy = true; clearError(); choices.classList.add('is-busy');
      try {
        var res = await fetch('/api/vision-unlock', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: password })
        });
        if (res.ok) {
          // Įsimenam kalbą — dokumentas ją perskaitys (localStorage, tas pats origin).
          try { localStorage.setItem('lapasid_lang', lang); } catch (e) {}
          btn.classList.add('is-correct');                 // pasirinktas mygtukas pažaliuoja
          setTimeout(function() { window.location.href = '/vision/doc'; }, 520);
        } else {
          busy = false; choices.classList.remove('is-busy'); showError();
        }
      } catch (e) {
        busy = false; choices.classList.remove('is-busy'); showError();
      }
    }

    Array.prototype.forEach.call(document.querySelectorAll('.choice'), function(btn) {
      btn.addEventListener('click', function() { submit(btn.dataset.lang, btn); });
    });

    // Enter slaptažodžio lauke → submit su anksčiau pasirinkta arba LT (pirminė rinka) kalba.
    pw.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        var saved = null; try { saved = localStorage.getItem('lapasid_lang'); } catch (ex) {}
        var lang = (saved === 'en' || saved === 'lt') ? saved : 'lt';
        submit(lang, document.querySelector('.choice[data-lang="' + lang + '"]'));
      }
    });
    pw.addEventListener('input', clearError);
    pw.focus();
  })();
</script>
</body>
</html>
